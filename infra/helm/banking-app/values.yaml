# This file contains the default values for the Banking Application Helm chart.

# ⚠️  REQUIRED: Override these at deploy time (--set or custom values file)
#   - tumid: your TUM ID (used for Ingress host names)
#   - postgres.database.password: a secure database password
#
# Example:
#   helm install ... --set tumid=ge42cer --set postgres.database.password=MyS3cret

tumid: ge42cer

# Whether to create the release namespace (set to false if pre-created)
namespace:
  create: true

# Git commit SHA – passed from CI to trigger rollouts on every code change
gitCommitSha: "local"

# Deploy timestamp – ensures every deploy triggers a rolling update,
# even when the gitCommitSha hasn't changed (e.g. image rebuild).
deployTimestamp: "0"

# Global image pull policy
imagePullPolicy: Always

# Image pull secrets for private registries (e.g. GHCR).
# Create the secret with:
#   kubectl create secret docker-registry ghcr-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<user> \
#     --docker-password=<token> \
#     -n <namespace>
imagePullSecrets:
  - name: ghcr-secret

# ---------- Account Service ----------
accountService:
  image:
    repository: ghcr.io/aet-devops26/account-service
    tag: latest
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  replicaCount: 1
  resources:
    limits:
      cpu: "300m"
      memory: "512Mi"
    requests:
      cpu: "150m"
      memory: "256Mi"

# ---------- Transaction Service ----------
transactionService:
  image:
    repository: ghcr.io/aet-devops26/transaction-service
    tag: latest
  service:
    type: ClusterIP
    port: 8082
    targetPort: 8082
  replicaCount: 1
  resources:
    limits:
      cpu: "300m"
      memory: "512Mi"
    requests:
      cpu: "150m"
      memory: "256Mi"

# ---------- Orchestrator Service ----------
orchestratorService:
  image:
    repository: ghcr.io/aet-devops26/orchestrator-service
    tag: latest
  service:
    type: ClusterIP
    port: 8083
    targetPort: 8083
  replicaCount: 1
  resources:
    limits:
      cpu: "300m"
      memory: "512Mi"
    requests:
      cpu: "150m"
      memory: "256Mi"

# ---------- Banking Service ----------
bankingService:
  image:
    repository: ghcr.io/aet-devops26/banking-service
    tag: latest
  service:
    type: ClusterIP
    port: 8084
    targetPort: 8084
  replicaCount: 1

  resources:
    limits:
      cpu: "300m"
      memory: "512Mi"
    requests:
      cpu: "150m"
      memory: "256Mi"
  # Enable Banking integration (PSD2 / Open Banking)
  enableBanking:
    appId: ""
    privateKeyPath: /etc/banking-secrets/eb_private_key.pem
    redirectUrl: ""
    baseUrl: https://api.enablebanking.com

# ---------- GenAI Service ----------
genaiService:
  image:
    repository: ghcr.io/aet-devops26/genai-service
    tag: latest
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  replicaCount: 1
  resources:
    limits:
      cpu: "300m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  # Model provider config. Set modelProvider=logos and pass logosKey (via
  # --set-string from a CI secret) to enable real LLM responses on Rancher.
  # Leave modelProvider=local to keep the canned offline fallback.
  modelProvider: local
  logosKey: ""
  logosBaseUrl: https://logos.aet.cit.tum.de
  logosModel: openai/gpt-oss-120b

# ---------- Client (Frontend) ----------
client:
  image:
    repository: ghcr.io/aet-devops26/client
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  replicaCount: 1
  resources:
    limits:
      cpu: "200m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

# ---------- PostgreSQL ----------
postgres:
  image:
    repository: postgres
    tag: 16-alpine
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  replicaCount: 1
  resources:
    limits:
      cpu: "300m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  storage:
    size: 1Gi
  database:
    name: bankdb
    user: bank
    # IMPORTANT: Override this via --set or a custom values file
    password: change-me-before-deploy

# ---------- Ingress ----------
ingress:
  enabled: true
  className: "nginx"
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

# ---------- Monitoring ----------
monitoring:
  prometheus:
    enabled: true
    ingressEnabled: true
    image:
      repository: prom/prometheus
      tag: v2.55.0
    service:
      type: ClusterIP
      port: 9090
      targetPort: 9090
    replicaCount: 1
    scrapeInterval: 15s
    storage:
      size: 8Gi
    resources:
      limits:
        cpu: "300m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"

  grafana:
    enabled: true
    ingressEnabled: true
    image:
      repository: grafana/grafana
      tag: 11.3.0
    service:
      type: ClusterIP
      port: 3000
      targetPort: 3000
    replicaCount: 1
    storage:
      size: 2Gi
    adminUser: admin
    adminPassword: "admin"
    resources:
      limits:
        cpu: "300m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"

  # ── Prometheus Operator CRDs (requires kube-prometheus-stack / Rancher Monitoring) ──
  # Enable these only if the Prometheus Operator is installed in the cluster.
  serviceMonitors:
    enabled: false
    # Must match the serviceMonitorSelector of your Prometheus Operator.
    # For Rancher Monitoring, this is typically "release: rancher-monitoring".
    labels:
      release: rancher-monitoring

  prometheusRules:
    enabled: false
    labels:
      release: rancher-monitoring
