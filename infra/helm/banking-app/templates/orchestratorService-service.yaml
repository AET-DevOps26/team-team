apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
  namespace: "{{ .Values.tumid }}-devops26"
spec:
  selector:
    app: orchestrator-service-selector
  ports:
    - port: {{ .Values.orchestratorService.service.port }}
      targetPort: {{ .Values.orchestratorService.service.targetPort }}
      protocol: TCP
  type: {{ .Values.orchestratorService.service.type }}
