apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.accountService.replicaCount }}
  selector:
    matchLabels:
      app: account-service-selector
  template:
    metadata:
      annotations:
        checksum/config: {{ include "banking-app.rolloutChecksum" . }}
      labels:
        app: account-service-selector
        monitoring: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: account-service
          image: "{{ .Values.accountService.image.repository }}:{{ .Values.accountService.image.tag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.accountService.service.targetPort }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.database.name }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ .Values.postgres.database.user }}"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # The balance-trend endpoint calls transaction-service to reconstruct
            # history; without this it falls back to localhost and returns a single
            # flat point. Mirrors the orchestrator's service-URL wiring.
            - name: TRANSACTION_SERVICE_URL
              value: "http://transaction-service:{{ .Values.transactionService.service.port }}"
          resources:
            {{- toYaml .Values.accountService.resources | nindent 12 }}
