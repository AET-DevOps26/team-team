apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.genaiService.replicaCount }}
  selector:
    matchLabels:
      app: genai-service-selector
  template:
    metadata:
      annotations:
        checksum/config: {{ include "banking-app.rolloutChecksum" . }}
      labels:
        app: genai-service-selector
        monitoring: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: genai-service
          image: "{{ .Values.genaiService.image.repository }}:{{ .Values.genaiService.image.tag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.genaiService.service.targetPort }}
          env:
            - name: MODEL_PROVIDER
              value: {{ .Values.genaiService.modelProvider | quote }}
            {{- if eq (.Values.genaiService.modelProvider | lower) "logos" }}
            - name: LOGOS_BASE_URL
              value: {{ .Values.genaiService.logosBaseUrl | quote }}
            - name: LOGOS_MODEL
              value: {{ .Values.genaiService.logosModel | quote }}
            - name: LOGOS_KEY
              valueFrom:
                secretKeyRef:
                  name: genai-logos-key
                  key: LOGOS_KEY
            {{- end }}
          resources:
            {{- toYaml .Values.genaiService.resources | nindent 12 }}
