apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.orchestratorService.replicaCount }}
  selector:
    matchLabels:
      app: orchestrator-service-selector
  template:
    metadata:
      annotations:
        checksum/config: {{ include "banking-app.rolloutChecksum" . }}
      labels:
        app: orchestrator-service-selector
        monitoring: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: orchestrator-service
          image: "{{ .Values.orchestratorService.image.repository }}:{{ .Values.orchestratorService.image.tag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - containerPort:
                {{ .Values.orchestratorService.service.targetPort }}
          env:
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service:{{ .Values.accountService.service.port }}"
            - name: TRANSACTION_SERVICE_URL
              value: "http://transaction-service:{{ .Values.transactionService.service.port }}"
            - name: GENAI_SERVICE_URL
              value: "http://genai-service:{{ .Values.genaiService.service.port }}"
            - name: BANKING_SERVICE_URL
              value: "http://banking-service:{{ .Values.bankingService.service.port }}"
            - name: APP_CORS_ALLOWED_ORIGINS
              value: "https://{{ .Values.tumid }}-devops-ss26.stud.k8s.aet.cit.tum.de"
            # DB access — UserRepository (JdbcClient) needs this to upsert users on sign-in.
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.database.name }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ .Values.postgres.database.user }}"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # GitHub OAuth login for the app itself. Empty defaults keep the deployment valid
            # for helm-dry-run; real values are injected by cd.yml from GH_OAUTH_CLIENT_ID /
            # GH_OAUTH_CLIENT_SECRET repo secrets.
            - name: GITHUB_CLIENT_ID
              value: "{{ .Values.orchestratorService.githubOauth.clientId }}"
            - name: GITHUB_CLIENT_SECRET
              value: "{{ .Values.orchestratorService.githubOauth.clientSecret }}"
            - name: GITHUB_REDIRECT_URI
              value: "https://{{ .Values.tumid }}-devops-ss26.stud.k8s.aet.cit.tum.de/login/oauth2/code/github"
          resources:
            {{- toYaml .Values.orchestratorService.resources | nindent 12 }}
