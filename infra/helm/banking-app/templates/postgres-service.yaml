apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: { { .Release.Namespace | quote } }
spec:
  selector:
    app: postgres-selector
  ports:
    - port: { { .Values.postgres.service.port } }
      targetPort: { { .Values.postgres.service.targetPort } }
      protocol: TCP
  type: { { .Values.postgres.service.type } }
