apiVersion: v1
kind: Service
metadata:
  name: genai-service
  namespace: "{{ .Values.tumid }}-devops26"
spec:
  selector:
    app: genai-service-selector
  ports:
    - port: {{ .Values.genaiService.service.port }}
      targetPort: {{ .Values.genaiService.service.targetPort }}
      protocol: TCP
  type: {{ .Values.genaiService.service.type }}
