---
- name: Provision and deploy team-team stack
  hosts: app
  become: true
  gather_facts: true

  vars_files:
    - group_vars/all.yml

  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  tasks:
    # ---------------------------------------------------------------------
    # Base packages
    # ---------------------------------------------------------------------
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - rsync
          - ufw
          - python3-pip
        state: present

    # ---------------------------------------------------------------------
    # Docker Engine + Compose plugin (official Docker apt repo)
    # ---------------------------------------------------------------------
    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add admin user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # ---------------------------------------------------------------------
    # Sync project files
    # ---------------------------------------------------------------------
    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Ensure letsencrypt directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/letsencrypt"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Ensure acme.json exists with strict permissions
      ansible.builtin.copy:
        dest: "{{ app_dir }}/letsencrypt/acme.json"
        content: ""
        force: false
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Sync project sources to VM
      ansible.posix.synchronize:
        src: "{{ local_project_root }}/"
        dest: "{{ app_dir }}/"
        delete: true
        recursive: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.github"
          - "--exclude=infra/terraform/.terraform"
          - "--exclude=infra/terraform/ssh"
          - "--exclude=infra/terraform/terraform.tfstate*"
          - "--exclude=node_modules"
          - "--exclude=server/**/build"
          - "--exclude=server/.gradle"
          - "--exclude=letsencrypt"
          - "--exclude=.env"
      become: false

    - name: Fix ownership of synced files
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true

    - name: Ensure gradlew is executable
      ansible.builtin.file:
        path: "{{ app_dir }}/server/gradlew"
        mode: "0755"

    - name: Set ACME email in Traefik config
      ansible.builtin.replace:
        path: "{{ app_dir }}/config/traefik/traefik.yaml"
        regexp: '^(\s*email:\s*).*$'
        replace: '\1{{ acme_email }}'

    - name: Render Traefik dynamic config with real ACME domain
      ansible.builtin.template:
        src: dynamic.yaml.j2
        dest: "{{ app_dir }}/config/traefik/dynamic.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    # ---------------------------------------------------------------------
    # Enable Banking private key (only when secret is provided)
    # ---------------------------------------------------------------------
    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/secrets"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"
      when: eb_private_key_pem | default('') | length > 0

    - name: Write Enable Banking private key
      ansible.builtin.copy:
        dest: "{{ app_dir }}/secrets/eb_private_key.pem"
        content: "{{ eb_private_key_pem }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      when: eb_private_key_pem | default('') | length > 0
      no_log: true

    # ---------------------------------------------------------------------
    # Render .env on the VM
    # ---------------------------------------------------------------------
    - name: Render .env file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        content: |
          {% for k, v in app_env.items() %}
          {{ k }}={{ v }}
          {% endfor %}

    # ---------------------------------------------------------------------
    # Build the client bundle on the VM so client/Dockerfile can COPY dist/.
    # We use a throwaway Node container instead of installing Node on the host
    # so nothing about the base image needs to change (Docker is already there).
    # ---------------------------------------------------------------------
    - name: Build client bundle (npm ci + npm run build)
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          -v {{ app_dir }}/client:/app -w /app
          node:22-alpine sh -c "npm ci && npm run build"
      register: client_build
      changed_when: true

    # ---------------------------------------------------------------------
    # Bring the stack up
    # ---------------------------------------------------------------------
    - name: Build and start docker compose stack
      ansible.builtin.command:
        cmd: docker compose --env-file .env up -d --build --remove-orphans
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: "'Creating' in compose_up.stderr or 'Recreating' in compose_up.stderr or 'Started' in compose_up.stderr"

    - name: Show running containers
      ansible.builtin.command: docker compose ps
      args:
        chdir: "{{ app_dir }}"
      register: compose_ps
      changed_when: false

    - name: Deployment summary
      ansible.builtin.debug:
        msg: |
          ================================================
          Deployment complete.

          Public IP: {{ app_public_ip }}
          FQDN:      {{ app_fqdn }}

          App URL:   http://{{ app_fqdn }}/

          {{ compose_ps.stdout }}
          ================================================
