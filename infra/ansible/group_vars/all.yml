---
# Edit values, then point the playbook at this file via -e @group_vars/all.yml
# (Already wired through ansible.cfg + the deploy script.)

# Directory on the VM where the project will live
app_dir: /opt/team-team

# Local path (on the control machine) to the repository root that will be synced to the VM.
# Defaults to two levels above the ansible directory.
local_project_root: "{{ playbook_dir }}/../.."

# Email used by Traefik for Let's Encrypt ACME registration / expiry notices.
acme_email: admin@tum.de

# Environment file rendered onto the VM.
# Override these via --extra-vars or a vault file in production.
app_env:
  POSTGRES_USER: bank
  POSTGRES_PASSWORD: admin-bankpass
  APP_HOSTNAME: "{{ app_fqdn | default(app_public_ip) }}"
  TRAEFIK_HTTP_PORT: "80"
  TRAEFIK_HTTPS_PORT: "443"
  TRAEFIK_DASHBOARD_PORT: "8080"
  # Enable Banking — injected via --extra-vars from GitHub secrets.
  # When eb_private_key_pem is empty, the volume falls back to /dev/null so
  # docker compose still starts; banking-service just can't reach the API.
  ENABLE_BANKING_APP_ID: "{{ eb_app_id | default('') }}"
  ENABLE_BANKING_PRIVATE_KEY_PATH: "{{ (app_dir ~ '/secrets/eb_private_key.pem') if (eb_private_key_pem | default('') | length > 0) else '/dev/null' }}"
  ENABLE_BANKING_REDIRECT_URL: "{{ eb_redirect_url | default('https://localhost/callback') }}"
  # GenAI / Logos — injected via --extra-vars from GitHub secret LOGOS_KEY.
  # When empty, MODEL_PROVIDER falls back to 'local' so /chat still works with
  # the canned offline reply instead of throwing on every request.
  MODEL_PROVIDER: "{{ 'logos' if (logos_key | default('') | length > 0) else 'local' }}"
  LOGOS_KEY: "{{ logos_key | default('') }}"
  LOGOS_BASE_URL: "{{ logos_base_url | default('https://logos.aet.cit.tum.de') }}"
  LOGOS_MODEL: "{{ logos_model | default('openai/gpt-oss-120b') }}"
