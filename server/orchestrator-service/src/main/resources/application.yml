spring:
  main:
    # Force Servlet (Tomcat) mode because both spring-boot-starter-web
    # and spring-boot-starter-webflux are on the classpath. Without this,
    # Spring Boot may configure a reactive context that lacks the
    # WebClient.Builder bean.
    web-application-type: servlet

server:
  port: ${SERVER_PORT:8083}

services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  transaction:
    url: ${TRANSACTION_SERVICE_URL:http://localhost:8082}
  genai:
    url: ${GENAI_SERVICE_URL:http://localhost:8000}
  banking:
    url: ${BANKING_SERVICE_URL:http://localhost:8084}

app:
  cors:
    # 3000 = client container, 5173 = Vite dev server
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
