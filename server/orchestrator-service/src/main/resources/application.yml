server:
  port: ${SERVER_PORT:8083}
  # Behind Traefik (TLS terminator). Honor X-Forwarded-Proto/Host so Spring
  # sees the real request scheme+host and treats browser calls from
  # https://<APP_HOSTNAME> as same-origin (otherwise CORS rejects them
  # with `Invalid CORS request`).
  forward-headers-strategy: framework

spring:
  # The orchestrator persists registered app users (see UserRepository) directly
  # via JdbcClient — no JPA. Defaults mirror the other services' compose config.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankdb}
    username: ${SPRING_DATASOURCE_USERNAME:bank}
    password: ${SPRING_DATASOURCE_PASSWORD:bank}
    driver-class-name: org.postgresql.Driver

services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  transaction:
    url: ${TRANSACTION_SERVICE_URL:http://localhost:8082}
  genai:
    url: ${GENAI_SERVICE_URL:http://localhost:8000}
  banking:
    url: ${BANKING_SERVICE_URL:http://localhost:8084}

app:
  cors:
    # 3000 = client container, 5173 = Vite dev server,
    # https://localhost = Traefik dev deployment (self-signed TLS).
    # Add the production FQDN here (or via APP_CORS_ALLOWED_ORIGINS) too.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://localhost}

# Lightweight GitHub OAuth login (see AuthController). All three values must be set for
# /api/auth/github/* to work; empty defaults keep the service startable in tests / CI.
# The redirect-uri MUST match the "Authorization callback URL" registered on the GitHub OAuth App
# (Settings -> Developer settings -> OAuth Apps). It points at the SPA route that posts back to
# /api/auth/github/callback.
github:
  client-id: ${GITHUB_CLIENT_ID:}
  client-secret: ${GITHUB_CLIENT_SECRET:}
  redirect-uri: ${GITHUB_REDIRECT_URI:https://localhost/login/oauth2/code/github}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
