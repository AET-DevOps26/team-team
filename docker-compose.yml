networks:
  backend:
    internal: true
  edge: {}
  # Outbound-only internet for banking-service (Enable Banking API). Keeps the rest of
  # `backend` internal; not exposed inbound (no published ports, no Traefik router).
  egress: {}

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

services:
  # -------------------------
  # TRAEFIK (EDGE ROUTER)
  # -------------------------
  reverse-proxy:
    image: traefik:v3.6.15
    container_name: traefik

    restart: unless-stopped

    ports:
      - "${TRAEFIK_HTTP_PORT:-8088}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt
      - ./config/traefik/traefik.yaml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic.yaml:/etc/traefik/dynamic.yml:ro

    networks:
      - edge

  # -------------------------
  # DATABASE
  # -------------------------
  database:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

  # -------------------------
  # ACCOUNT SERVICE
  # -------------------------
  account-service:
    image: ghcr.io/aet-devops26/account-service:latest
    build:
      context: ./server
      dockerfile: account-service/Dockerfile

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/bankdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bank}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      SERVER_PORT: 8081
      # The balance-trend endpoint reconstructs history from transaction-service;
      # without this it falls back to localhost and returns a single flat point.
      TRANSACTION_SERVICE_URL: http://transaction-service:8082

    depends_on:
      database:
        condition: service_healthy

    networks:
      - backend

  # -------------------------
  # TRANSACTION SERVICE
  # -------------------------
  transaction-service:
    image: ghcr.io/aet-devops26/transaction-service:latest
    build:
      context: ./server
      dockerfile: transaction-service/Dockerfile

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/bankdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bank}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      SERVER_PORT: 8082

    depends_on:
      database:
        condition: service_healthy

    networks:
      - backend

  # -------------------------
  # BANKING SERVICE (ENABLE BANKING / PSD2)
  # PEM key + app ID are injected by Ansible from GitHub secrets
  # (EB_PRIVATE_KEY / EB_APP_ID). Without them the volume falls back to
  # /dev/null and the service can't reach Enable Banking.
  # -------------------------
  banking-service:
    image: ghcr.io/aet-devops26/banking-service:latest
    build:
      context: ./server
      dockerfile: banking-service/Dockerfile

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/bankdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bank}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      SERVER_PORT: 8084
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_PRIVATE_KEY_PATH: /run/secrets/eb_private_key
      ENABLE_BANKING_REDIRECT_URL: ${ENABLE_BANKING_REDIRECT_URL:-https://localhost/callback}

    depends_on:
      database:
        condition: service_healthy

    volumes:
      - ${ENABLE_BANKING_PRIVATE_KEY_PATH:-/dev/null}:/run/secrets/eb_private_key:ro

    # backend for internal traffic (DB, orchestrator); egress for the external
    # Enable Banking API. Higher-priority egress provides the default route so
    # outbound calls don't dead-end on the internal backend network.
    networks:
      backend:
        priority: 100
      egress:
        priority: 200

  # -------------------------
  # GENAI SERVICE
  # -------------------------
  genai-service:
    image: ghcr.io/aet-devops26/genai-service:latest
    build:
      context: ./genai
      dockerfile: Dockerfile

    environment:
      # `logos` = TUM AET Logos gateway (OpenAI-compatible). Requires LOGOS_KEY.
      # Falls back to a canned local reply when the upstream is unreachable.
      MODEL_PROVIDER: ${MODEL_PROVIDER:-logos}
      LOGOS_KEY: ${LOGOS_KEY:-}
      LOGOS_BASE_URL: ${LOGOS_BASE_URL:-https://logos.aet.cit.tum.de}
      LOGOS_MODEL: ${LOGOS_MODEL:-openai/gpt-oss-120b}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1:8b

    # backend for the orchestrator; egress provides the default outbound route
    # to the external Logos gateway (backend is internal-only).
    networks:
      backend:
        priority: 100
      egress:
        priority: 200

  # -------------------------
  # ORCHESTRATOR (BFF / API LAYER)
  # -------------------------
  orchestrator-service:
    image: ghcr.io/aet-devops26/orchestrator-service:latest
    build:
      context: ./server
      dockerfile: orchestrator-service/Dockerfile

    environment:
      SERVER_PORT: 8083
      ACCOUNT_SERVICE_URL: http://account-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      GENAI_SERVICE_URL: http://genai-service:8000
      BANKING_SERVICE_URL: http://banking-service:8084
      # Browser hits the app at https://${APP_HOSTNAME} (Traefik TLS).
      # Include it in the CORS allow-list on top of the localhost defaults.
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,https://localhost,https://${APP_HOSTNAME}

    depends_on:
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      genai-service:
        condition: service_started
      banking-service:
        condition: service_started

    networks:
      - backend
      - edge

  # -------------------------
  # CLIENT (FRONTEND)
  # -------------------------
  client:
    image: ghcr.io/aet-devops26/client:latest
    build:
      context: ./client
      dockerfile: Dockerfile

    environment:
      PUBLIC_API_URL: https://${APP_HOSTNAME}/api

    depends_on:
      - orchestrator-service

    networks:
      - edge

  # -------------------------
  # PROMETHEUS
  # -------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend

  # -------------------------
  # ALERTMANAGER
  # -------------------------
  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - backend

  # -------------------------
  # GRAFANA
  # -------------------------
  grafana:
    image: grafana/grafana:11.1.4

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin1
      GF_SERVER_ROOT_URL: "https://localhost/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

    networks:
      # edge = reachable via Traefik; backend = can reach Prometheus/Alertmanager.
      - edge
      - backend
