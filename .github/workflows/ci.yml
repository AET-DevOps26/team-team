name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Xmx512m -Dfile.encoding=UTF-8
      JAVA_TOOL_OPTIONS: -Xmx6g -XX:MaxMetaspaceSize=512m

    steps:
      # ---------------- Checkout ----------------
      - name: Checkout
        uses: actions/checkout@v7

      # ---------------- Java + Gradle cache ----------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ---------------- Node ----------------
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # ---------------- Python ----------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---------------- Backend quality gate ----------------
      - name: Backend quality gate (compile + test + lint)
        working-directory: server
        run: ./gradlew test spotlessCheck --parallel --stacktrace --build-cache

      # ---------------- Python tests ----------------
      - name: Test genai
        working-directory: genai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest

      # ---------------- Frontend: lint, test & build ----------------
      - name: Lint, test & build client
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
          npm run build
