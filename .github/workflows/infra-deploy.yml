name: Infra Deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "infra/ansible/**"
      - "config/**"
      - "docker-compose.yml"
      - "client/**"
      - "server/**"
      - "genai/**"
      - ".github/workflows/infra-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for azure/login OIDC

concurrency:
  # Never run two deploys at the same time — Terraform state lock + idempotent Ansible runs.
  group: infra-deploy-main
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  deploy:
    name: Terraform apply + Ansible deploy
    runs-on: ubuntu-latest
    # Apply and Ansible run in a SINGLE job so they share the same runner —
    # and therefore the same public IP. The NSG SSH rule is pinned to that
    # /32, so the very runner that provisions the VM is also the only host
    # allowed to SSH into it for the Ansible step.
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Detect runner public IP
        id: ip
        # The validation rule rejects "*" / "0.0.0.0/0". Pin SSH access to the
        # runner's own /32 so the NSG only opens port 22 to this runner.
        run: |
          ip="$(curl -4 -fsS --retry 3 --connect-timeout 5 --max-time 10 https://api.ipify.org | tr -d '\n')"
          echo "cidr=${ip}/32" >> "$GITHUB_OUTPUT"

      - name: Write SSH keys for VM
        run: |
          mkdir -p ssh
          printf '%s\n' "${{ secrets.VM_SSH_PUBLIC_KEY }}" > ssh/id_rsa.pub
          chmod 644 ssh/id_rsa.pub
          # Private key required by ansible_inventory precondition and used
          # later by the Ansible step.
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ssh/id_rsa
          chmod 600 ssh/id_rsa
          echo 'ssh_public_key_path = "ssh/id_rsa.pub"' >> terraform.tfvars
          # Required: explicit CIDR allowed to SSH the VM (the runner's /32).
          echo "allowed_ssh_cidr = \"${{ steps.ip.outputs.cidr }}\"" >> terraform.tfvars

      - name: Terraform init (remote backend)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=main.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export outputs
        id: tf-outputs
        run: |
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "fqdn=$(terraform output -raw fqdn)" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(terraform output -raw resource_group)" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install "ansible-core>=2.16"

      - name: Install collections
        working-directory: infra/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/team-team-azure
          chmod 600 ~/.ssh/team-team-azure
          ssh-keyscan -H "${{ steps.tf-outputs.outputs.public_ip }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Override inventory SSH key path
        working-directory: infra/ansible
        run: |
          sed -i "s|ansible_ssh_private_key_file=[^ ]*|ansible_ssh_private_key_file=$HOME/.ssh/team-team-azure|g" inventory.ini
          cat inventory.ini

      - name: Write Enable Banking extra-vars
        env:
          EB_PRIVATE_KEY: ${{ secrets.EB_PRIVATE_KEY }}
          EB_APP_ID: ${{ secrets.EB_APP_ID }}
          EB_REDIRECT_URL: ${{ secrets.EB_REDIRECT_URL }}
          LOGOS_KEY: ${{ secrets.LOGOS_KEY }}
          # GitHub Actions won't allow secret names starting with GITHUB_, so the OAuth App
          # credentials for the app itself are stored as GH_OAUTH_AZURE_CLIENT_ID / _CLIENT_SECRET
          # and translated to GITHUB_CLIENT_ID / _SECRET on the VM by group_vars/all.yml.
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_AZURE_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_AZURE_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os
          data = {
              "eb_private_key_pem":          os.environ.get("EB_PRIVATE_KEY", ""),
              "eb_app_id":                   os.environ.get("EB_APP_ID", ""),
              "eb_redirect_url":             os.environ.get("EB_REDIRECT_URL", ""),
              "logos_key":                   os.environ.get("LOGOS_KEY", ""),
              "github_oauth_client_id":      os.environ.get("GH_OAUTH_CLIENT_ID", ""),
              "github_oauth_client_secret":  os.environ.get("GH_OAUTH_CLIENT_SECRET", ""),
          }
          with open("/tmp/eb-vars.json", "w") as f:
              json.dump(data, f)
          PY
          chmod 600 /tmp/eb-vars.json

      - name: Run playbook
        working-directory: infra/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "1"
        run: ansible-playbook -i inventory.ini playbook.yml --extra-vars "@/tmp/eb-vars.json"

      - name: Summary
        run: |
          echo "## Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public IP: \`${{ steps.tf-outputs.outputs.public_ip }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- FQDN: https://${{ steps.tf-outputs.outputs.fqdn }}" >> "$GITHUB_STEP_SUMMARY"
