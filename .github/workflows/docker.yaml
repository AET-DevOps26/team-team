name: Build and Push All Services to GHCR

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: aet-devops26

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: account-service
            dockerfile: server/account-service/Dockerfile
            context: server

          - service: transaction-service
            dockerfile: server/transaction-service/Dockerfile
            context: server

          - service: orchestrator-service
            dockerfile: server/orchestrator-service/Dockerfile
            context: server

          - service: genai-service
            dockerfile: genai/Dockerfile
            context: genai

          - service: client
            dockerfile: client/Dockerfile
            context: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max