name: Build and Push All Services to GHCR

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: aet-devops26

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:

          # 🟢 Spring services (own Dockerfile per service)
          - service: account-service
            dockerfile: server/account-service/Dockerfile
            context: server

          - service: transaction-service
            dockerfile: server/transaction-service/Dockerfile
            context: server

          - service: orchestrator-service
            dockerfile: server/orchestrator-service/Dockerfile
            context: server

          # 🟡 standalone services
          - service: genai-service
            dockerfile: genai/Dockerfile
            context: genai

          - service: client
            dockerfile: client/Dockerfile
            context: client

    steps:
      - uses: actions/checkout@v4

      # ---------------- Build step (ALWAYS) ----------------
      - name: Build Docker image (no push)
        run: |
          docker build \
            -t $REGISTRY/$OWNER/${{ matrix.service }}:ci-build \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      # ---------------- Login (only needed if pushing) ----------------
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- Build + Push ONLY on main ----------------
      - name: Build and Push Docker image (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t $REGISTRY/$OWNER/${{ matrix.service }}:latest \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

          docker push $REGISTRY/$OWNER/${{ matrix.service }}:latest
