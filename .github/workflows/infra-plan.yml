name: Infra Plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/ansible/**"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/infra-deploy.yml"

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform-plan:
    name: Terraform fmt / validate / plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for azure/login OIDC
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        # Only checks .tf / .tfvars files committed to the repo.
        # Runs before we write any generated terraform.tfvars so the check
        # isn't tripped up by lines we appended below.
        run: terraform fmt -check -recursive

      - name: Detect runner public IP
        id: ip
        # The validation rule rejects "*" / "0.0.0.0/0", so we pin SSH to the
        # runner's own /32. Plan doesn't connect, but it must still pass the
        # variable validation.
        run: |
          ip="$(curl -4 -fsS --retry 3 --connect-timeout 5 --max-time 10 https://api.ipify.org | tr -d '\n')"
          echo "cidr=${ip}/32" >> "$GITHUB_OUTPUT"

      - name: Write SSH keys for VM
        run: |
          mkdir -p ssh
          printf '%s\n' "${{ secrets.VM_SSH_PUBLIC_KEY }}" > ssh/id_rsa.pub
          chmod 644 ssh/id_rsa.pub
          # Private key is required by the ansible_inventory precondition
          # (fileexists check) even during plan.
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ssh/id_rsa
          chmod 600 ssh/id_rsa
          # Avoid Terraform regenerating a key — point it at the supplied one.
          echo 'ssh_public_key_path = "ssh/id_rsa.pub"' >> terraform.tfvars
          # Required: explicit CIDR allowed to SSH the VM (never "*").
          echo "allowed_ssh_cidr = \"${{ steps.ip.outputs.cidr }}\"" >> terraform.tfvars

      - name: Terraform init (remote backend)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ github.ref_name }}.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      - name: Comment plan summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const output = `### Terraform plan \`${{ steps.plan.outcome }}\`
            <details><summary>Show plan</summary>

            \`\`\`
            ${process.env.PLAN_TEXT || '(plan output not captured)'}
            \`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
        env:
          PLAN_TEXT: ${{ steps.plan.outputs.stdout }}

      - name: Fail job if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  ansible-lint:
    name: Ansible syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install "ansible-core>=2.16" ansible-lint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check playbook
        run: ansible-playbook playbook.yml --syntax-check -i localhost,

      - name: Lint playbook
        run: ansible-lint playbook.yml
        continue-on-error: true
